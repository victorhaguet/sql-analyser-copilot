[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-analyser-copilot"
version = "0.1.0"
description = "A LangGraph-based SQL copilot for SQLite analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "jinja2>=3.1,<4.0",
    "langgraph>=0.2,<1.0",
    "langchain-openai>=0.3.9,<2.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "streamlit>=1.45,<2.0",
    "uvicorn>=0.30,<1.0",
    "coverage==7.14.0",
    "passlib>=1.7,<2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
